name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      helm: ${{ steps.filter.outputs.helm_any_changed }}
      chart: ${{ steps.filter.outputs.chart_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Detect changed files
        uses: tj-actions/changed-files@c3a1bb2c992d77180ae65be6ae6c166cf40f857c # v45.0.3
        id: filter
        with:
          files_yaml: |
            helm:
              - 'install/helm-repo/**'
            chart:
              - 'install/helm-repo/argocd-clusterprofile-controller/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: --timeout 5m0s

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -cover

      - name: Build manager
        run: go build ./...

  validate-helm-charts:
    name: Validate Helm charts
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.20.2

      - name: Validate values schema
        run: make validate-values-schema

      - name: Validate helm-docs generation
        uses: losisin/helm-docs-github-action@2ccf3e77eb70dc80d62f8cc26f15d0a96b75fef4 # v1.8.0
        with:
          chart-search-root: install/helm-repo
          fail-on-diff: true
          version: v1.14.2

  check-chart-version:
    name: Check chart version bump
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.chart == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check chart version was bumped
        run: |
          set -euo pipefail
          CHART_PATH="install/helm-repo/argocd-clusterprofile-controller/Chart.yaml"

          if ! git cat-file -e "origin/${{ github.base_ref }}:${CHART_PATH}" 2>/dev/null; then
            echo "Chart is new on this branch; skipping version bump comparison."
            exit 0
          fi

          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:${CHART_PATH}" | yq '.version')
          HEAD_VERSION=$(yq '.version' "${CHART_PATH}")

          echo "Base version: ${BASE_VERSION}"
          echo "Head version: ${HEAD_VERSION}"

          if [ "${BASE_VERSION}" = "${HEAD_VERSION}" ]; then
            echo "::error::Chart files changed but chart version was not bumped. Please update the 'version' field in ${CHART_PATH}."
            exit 1
          fi

          LOWEST=$(printf '%s\n%s' "${BASE_VERSION}" "${HEAD_VERSION}" | sort -V | head -n1)
          if [ "${LOWEST}" != "${BASE_VERSION}" ]; then
            echo "::error::Chart version must be strictly greater than the base branch (${BASE_VERSION}), but is ${HEAD_VERSION}."
            exit 1
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - lint
      - go
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Setup kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.3

      - name: Setup Argo CD CLI
        env:
          ARGOCD_CLI_VERSION: v3.4.3
        run: |
          curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-linux-amd64"
          curl -sSL -o cli_checksums.txt "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/cli_checksums.txt"
          awk '$2 == "argocd-linux-amd64" { print $1 "  argocd"; found=1 } END { exit found ? 0 : 1 }' cli_checksums.txt > argocd.sha256
          sha256sum -c argocd.sha256
          sudo install -m 0755 argocd /usr/local/bin/argocd

      - name: Verify e2e tools
        run: |
          kind version
          kubectl version --client=true
          helm version --short
          argocd version --client --short
          jq --version

      - name: Run full e2e
        run: make e2e
